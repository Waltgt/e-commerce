services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
    networks:
      - ecommerce-net

  api1:
    image: ghcr.io/Waltgt/sistema-ecommerce-backend:latest
    container_name: api1
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      - INSTANCE_NAME=api1
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge