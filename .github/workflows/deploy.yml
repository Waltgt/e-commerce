name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and restart on server-api (api1 + nginx)
        run: |
          cd ~/sistema-ecommerce/infra
          docker compose -f docker-compose.server-api.yml pull
          docker compose -f docker-compose.server-api.yml up -d

      - name: Pull and restart on server-api2 (api2)
        run: |
          ssh -o StrictHostKeyChecking=no walter-upana@10.0.2.9 \
            "cd ~/sistema-ecommerce/infra && docker compose -f docker-compose.server-api2.yml pull && docker compose -f docker-compose.server-api2.yml up -d"